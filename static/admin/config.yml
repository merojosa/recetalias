backend:
  name: git-gateway
  repo: merojosa/recetalias
  branch: main
  auth_type: pkce
  base_url: https://auth.decapbridge.com
  auth_endpoint: /sites/a7221cd4-0fa7-4580-924a-e4a0f9115624/pkce
  auth_token_endpoint: /sites/a7221cd4-0fa7-4580-924a-e4a0f9115624/token
  gateway_url: https://gateway.decapbridge.com

  commit_messages:
    create: Create {{collection}} “{{slug}}” - {{author-name}}
    update: Update {{collection}} “{{slug}}” - {{author-name}}
    delete: Delete {{collection}} “{{slug}}” - {{author-name}}
    uploadMedia: Upload “{{path}}” - {{author-name}}
    deleteMedia: Delete “{{path}}” - {{author-name}}
    openAuthoring: Message {{message}} - {{author-name}}

auth:
  email_claim: email
  first_name_claim: first_name
  last_name_claim: last_name
  avatar_url_claim: avatar_url

logo_url: https://decapbridge.com/decapcms-with-bridge.svg

site_url: https://recetalias.com

media_folder: static/images/uploads
public_folder: /images/uploads

locale: es

collections:
  - name: 'ingredients'
    label: 'Ingredientes'
    files:
      - name: 'all-ingredients'
        label: 'Todos los ingredientes'
        file: 'src/lib/data/ingredients.json'
        fields:
          - label: 'Ingredientes'
            name: 'ingredients'
            widget: 'list'
            label_singular: 'Ingrediente'
            collapsed: true
            summary: '{{fields.name}} ({{fields.id}})'
            fields:
              - { label: 'Nombre', name: 'name', widget: 'string', required: true }

  - name: 'recipes'
    label: 'Recetas'
    files:
      - name: 'all-recipes'
        label: 'Todas las recetas'
        file: 'src/lib/data/recipes.json'
        fields:
          - label: 'Estado del Despliegue'
            name: 'ci_status'
            widget: 'ci-status'
            required: false
          - label: 'Recetas'
            name: 'recipes'
            widget: 'list'
            label_singular: 'Receta'
            collapsed: true
            summary: '{{fields.title}} (/recetas/{{fields.id}})'
            fields:
              - { label: 'ID', name: 'id', widget: 'string', required: true, pattern: ['^[a-z0-9-]+$', 'Solo letras minúsculas, números y guiones'], hint: 'Compone el URL de la receta, no cambiarlo frecuentemente' }
              - { label: 'Título', name: 'title', widget: 'string', required: true }
              - label: 'Ingredientes'
                name: 'ingredients'
                widget: 'list'
                label_singular: 'Ingrediente'
                collapsed: false
                summary: '{{fields.quantity}} de {{fields.ingredient}}'
                min: 1
                fields:
                  - label: 'Cantidad'
                    name: 'quantity'
                    widget: 'string'
                    required: false
                    hint: 'Si escribe la cantidad, se unirá con el ingrediente en minúscula. Ej: "Dos tazas de arroz". Si no escribe cantidad, se pondrá el ingrediente en mayúscula. Ej: "Frijoles'
                  - label: 'Ingrediente'
                    name: 'ingredient'
                    widget: 'relation'
                    collection: 'ingredients'
                    file: 'all-ingredients'
                    search_fields: ['ingredients.*.name', 'ingredients.*.id']
                    display_fields: ['ingredients.*.name']
                    value_field: 'ingredients.*.id'
                    required: true
              - label: 'Fecha'
                name: 'date'
                widget: 'datetime'
                date_format: 'DD/MM/YYYY'
                time_format: false
                format: 'YYYY-MM-DD'
                required: true
              - label: 'Imagen'
                name: 'image'
                widget: 'object'
                collapsed: false
                fields:
                  - { label: 'URL', name: 'url', widget: 'image', required: true }
                  - { label: 'Texto alternativo', name: 'alt', widget: 'string', required: true }
              - label: 'Instrucciones'
                name: 'instructions'
                widget: 'list'
                field: { label: 'Paso', name: 'step', widget: 'text' }

